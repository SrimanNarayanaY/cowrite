spring.application.name=cowrite-api

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#synchronize false ki validate cheyali
spring.jpa.hibernate.ddl-auto=validate

#synchronize true ki update cheyali
#spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
server.port=8080

# Flyway - DB migrations ni Flyway handle chestundi, Hibernate kadu

#synchronize true ki true cheyali
#spring.flyway.enabled=true

#synchronize false ki false lone unchu
spring.flyway.enabled=false

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT - secret ni .env lo JWT_SECRET ga pettu (min 32 chars)
jwt.secret=${JWT_SECRET:secret-token-123}
jwt.expiration=${JWT_EXPIRATION:86400000}